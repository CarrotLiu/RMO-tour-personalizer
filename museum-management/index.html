<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcheoQuest Museum Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const isDevServer = ['localhost', '127.0.0.1', '0.0.0.0'].includes(window.location.hostname);

      const loadModule = (src) => {
        const app = document.createElement('script');
        app.type = 'module';
        app.src = src;
        document.body.appendChild(app);
      };

      if (isDevServer) {
        loadModule('/src/main.tsx');
      } else {
        const styles = document.createElement('link');
        styles.rel = 'stylesheet';
        styles.href = './dist/assets/app-BaD34YWS.css';
        document.head.appendChild(styles);

        loadModule('./dist/assets/app-Cpyr0I2W.js');
      }
    </script>
  </body>
</html>
