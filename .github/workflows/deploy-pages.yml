name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: field-journal-mobile-prototype/package-lock.json

      - name: Install field journal dependencies
        working-directory: field-journal-mobile-prototype
        run: npm ci

      - name: Build field journal prototype
        working-directory: field-journal-mobile-prototype
        run: npm run build

      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a \
            --exclude .git \
            --exclude .github \
            --exclude field-journal-mobile-prototype \
            ./ _site/
          mkdir -p _site/field-journal-mobile-prototype
          rsync -a field-journal-mobile-prototype/dist/ _site/field-journal-mobile-prototype/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
